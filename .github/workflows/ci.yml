name: TrekViet - CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trekviet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      checkin: ${{ steps.filter.outputs.checkin }}
      trekking: ${{ steps.filter.outputs.trekking }}
      community: ${{ steps.filter.outputs.community }}
      agent: ${{ steps.filter.outputs.agent }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/filters.yml

  auth:
    name: Auth service
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      service: auth-service
    secrets: inherit

  checkin:
    name: Checkin service
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.checkin == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      service: checkin-service
    secrets: inherit

  trekking:
    name: Trekking service
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.trekking == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      service: trekking-service
    secrets: inherit

  community:
    name: Community service
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.community == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      service: community-service
    secrets: inherit

  gateway:
    name: API gateway
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      service: api-gateway
    secrets: inherit

  agent:
    name: Python agent service
    permissions:
      contents: read
      packages: write
    needs: changes
    if: ${{ needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-python.yml
    with:
      service: agent-service
    secrets: inherit

  ci-result:
    name: CI result (required check)
    if: ${{ always() }}
    needs: [changes, auth, checkin, trekking, community, gateway, agent]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

  deploy-render:
    name: Render - ${{ matrix.service }}
    needs: [changes, ci-result]

    if: >-
      ${{
        always() &&
        needs.ci-result.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - service: api-gateway
            change: gateway
            service-id-secret: RENDER_API_GATEWAY_ID
            api-key-secret: RENDER_API_GATEWAY_KEY

          - service: auth-service
            change: auth
            service-id-secret: RENDER_AUTH_SERVICE_ID
            api-key-secret: RENDER_AUTH_SERVICE_KEY

          - service: checkin-service
            change: checkin
            service-id-secret: RENDER_CHECKIN_SERVICE_ID
            api-key-secret: RENDER_CHECKIN_SERVICE_KEY

          - service: trekking-service
            change: trekking
            service-id-secret: RENDER_TREKKING_SERVICE_ID
            api-key-secret: RENDER_TREKKING_SERVICE_KEY

          - service: agent-service
            change: agent
            service-id-secret: RENDER_AGENT_SERVICE_ID
            api-key-secret: RENDER_AGENT_SERVICE_KEY

    uses: ./.github/workflows/reusable-render.yml
    with:
      service: ${{ matrix.service }}
      enabled: ${{ needs.changes.outputs[matrix.change] == 'true' }}
    secrets:
      RENDER_SERVICE_ID: ${{ secrets[matrix.service-id-secret] }}
      RENDER_API_KEY: ${{ secrets[matrix.api-key-secret] }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
