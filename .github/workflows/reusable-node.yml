name: Reusable - Node.js DevSecOps

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '22'

jobs:
  test-security-quality:
    name: Lint, test, security and quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/services/${{ inputs.service }}
    steps:
      - name: Checkout full history for Sonar analysis
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: backend/services/${{ inputs.service }}/package-lock.json

      - name: Use the npm version used to validate lockfiles
        run: npm install --global npm@10.9.4

      - name: Install reproducible dependencies
        run: npm ci

      - name: Lint (package.json must define lint)
        run: npm run lint

      - name: Tests and coverage (package.json must define test:ci)
        run: npm run test:ci

      - name: Save coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ inputs.service }}
          path: backend/services/${{ inputs.service }}/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Trivy filesystem - vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          version: v0.76.1
          scan-ref: backend/services/${{ inputs.service }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
        run: python3 ../../ci/validate_sonar_config.py

      - name: SonarQube scan and Quality Gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          projectBaseDir: backend/services/${{ inputs.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}

      - name: Show Sonar background-task failure details
        if: ${{ failure() && steps.sonar.outcome == 'failure' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
        run: python3 ../../ci/report_sonar_task.py

  docker-image:
    name: Build, scan, publish image
    needs: test-security-quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Define immutable image tag
        id: image
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${OWNER}/trekviet-${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker build (service-local build context)
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build \
            --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --file "backend/services/${SERVICE}/Dockerfile" \
            --tag "$IMAGE_REF" \
            "backend/services/${SERVICE}"

      - name: Trivy image vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Login to GitHub Container Registry (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the scanned image (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE_REF"
