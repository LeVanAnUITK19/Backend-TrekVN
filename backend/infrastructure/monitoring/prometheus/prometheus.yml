global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: trekvn
    environment: render

rule_files:
  - alerts.yml

# Verify the target hostnames against your Render dashboard (no https://).
# The secret file contains ONLY the METRICS_TOKEN shared by the monitored services.
# No environment-variable substitution is performed by Prometheus.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-gateway
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['api-gateway-trekvn.onrender.com']
        labels:
          service: api-gateway

  - job_name: auth-service
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['backend-trekvn.onrender.com']
        labels:
          service: auth-service

  - job_name: checkin-service
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['checkin-service-trekvn.onrender.com']
        labels:
          service: checkin-service

  - job_name: trekking-service
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['trekking-service-trekvn.onrender.com']
        labels:
          service: trekking-service

  - job_name: agent-service
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['agent-service-trekvn.onrender.com']
        labels:
          service: agent-service

  - job_name: community-service
    honor_labels: true
    metrics_path: /metrics
    scheme: https
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ['backend-trekvn-pkrq.onrender.com']
        labels:
          service: community-service
