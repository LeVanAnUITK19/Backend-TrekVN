groups:
  - name: trekvn_services
    rules:
      - alert: ServiceDown
        expr: up{service=~".+"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cannot scrape {{ $labels.service }}"
          description: "Check deployment, /metrics token, hostname and cold starts: {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(trekvn_http_requests_total{status_code=~"5.."}[5m]))
          / sum by (service) (rate(trekvn_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5% on {{ $labels.service }}"

      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(trekvn_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 HTTP latency above 1s on {{ $labels.service }}"

      - alert: RateLimitHigh
        expr: sum by (service) (rate(trekvn_http_requests_total{status_code="429"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10 rate-limited requests/s on {{ $labels.service }}"

      - alert: EventLoopLag
        expr: nodejs_eventloop_lag_seconds{service=~".+"} > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag above 100ms on {{ $labels.service }}"
