<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f3f5f4;font-family:Arial,sans-serif;color:#222">
    <div style="max-width:520px;margin:auto;background:#fff;border:1px solid #dfe7e2;border-radius:8px;overflow:hidden">
      <div style="padding:24px;background:#1a7f4b;color:#fff;text-align:center;font-size:24px;font-weight:bold">TrekViet</div>
      <div style="padding:28px">
        <h1 style="font-size:20px;margin:0 0 20px">{{subject}}</h1>
        <p>Mã xác minh của bạn:</p>
        <div style="padding:18px;margin:24px 0;text-align:center;background:#f0faf5;border:2px dashed #1a7f4b;border-radius:8px;font-size:36px;font-weight:bold;letter-spacing:8px;color:#1a7f4b">{{passcode}}</div>
        <p>Mã có hiệu lực trong <strong>{{time}}</strong>. Không chia sẻ mã này với bất kỳ ai.</p>
        <p style="margin-top:24px;font-size:13px;color:#666">Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.</p>
      </div>
    </div>
  </body>
</html>
